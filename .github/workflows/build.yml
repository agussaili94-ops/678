name: Build 678 Web Recorder (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Download Static FFmpeg (ARM64)
      run: |
        wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
        tar -xf ffmpeg-release-arm64-static.tar.xz
        mv ffmpeg-*-arm64-static/ffmpeg ./ffmpeg
        chmod +x ./ffmpeg

    - name: Build Go Static Binary (Command Dewa)
      env:
        CGO_ENABLED: 0
        GOOS: linux
        GOARCH: arm64
      run: |
        go build -trimpath -ldflags="-s -w -extldflags '-static'" -tags netgo -o 678_multi 678_multi.go

    - name: Prepare Release Package
      run: |
        # Membuat folder khusus rilis dan mengumpulkan semua file pendukung dashboard
        mkdir -p release_package
        mv 678_multi release_package/
        cp 678_web.py release_package/
        cp starter.sh release_package/
        chmod +x release_package/starter.sh
        chmod +x release_package/678_multi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 678_web_recorder_arm64
        path: release_package/
